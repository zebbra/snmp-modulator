services:
  modulator:
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
        - no_proxy
    env_file:
      - .env
    volumes:
      - ./mapping.yaml:/app/mapping.yaml:ro
    restart: unless-stopped
    ports:
      - "${MODULATOR_PORT:-8081}:${MODULATOR_PORT:-8081}"

  # One-shot CLI probe — override entrypoint:
  #   docker compose run --rm cli --host 10.0.0.1 --dry-run
  #   docker compose run --rm cli --netbox-filter "role=switch&site=dc1" --dry-run
  cli:
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
        - no_proxy
    env_file:
      - .env
    volumes:
      - ./mapping.yaml:/app/mapping.yaml:ro
    entrypoint: ["python", "cli.py"]
    profiles:
      - cli
